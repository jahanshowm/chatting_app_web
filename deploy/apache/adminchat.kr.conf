# adminchat.kr — Bitnami LAMP Apache vhost (HTTP :80)
# Admin Web: /var/www/adminchat
# NestJS API: http://127.0.0.1:3001

<VirtualHost *:80>
  ServerName adminchat.kr
  ServerAlias www.adminchat.kr
  DocumentRoot "/var/www/adminchat"

  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:3001/api/
  ProxyPassReverse /api/ http://127.0.0.1:3001/api/
  ProxyPass /uploads/ http://127.0.0.1:3001/uploads/
  ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/
  ProxyPass /photos/ http://127.0.0.1:3001/photos/
  ProxyPassReverse /photos/ http://127.0.0.1:3001/photos/

  <Directory "/var/www/adminchat">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteRule ^/(api|uploads|photos)/ - [L]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
  RewriteRule ^ - [L]
  RewriteRule ^ /index.html [L]

  ErrorLog "/opt/bitnami/apache/logs/adminchat.kr-error.log"
  CustomLog "/opt/bitnami/apache/logs/adminchat.kr-access.log" combined
</VirtualHost>
