# adminchat.kr HTTPS — /opt/bitnami/apache/conf/vhosts/adminchat.kr-ssl-vhost.conf
# certbot: certbot certonly --webroot -w /var/www/adminchat -d adminchat.kr -d www.adminchat.kr

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName adminchat.kr
  ServerAlias www.adminchat.kr
  DocumentRoot "/var/www/adminchat"

  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:3001/api/
  ProxyPassReverse /api/ http://127.0.0.1:3001/api/
  ProxyPass /uploads/ http://127.0.0.1:3001/uploads/
  ProxyPassReverse /uploads/ http://127.0.0.1:3001/uploads/
  ProxyPass /photos/ http://127.0.0.1:3001/photos/
  ProxyPassReverse /photos/ http://127.0.0.1:3001/photos/

  <Directory "/var/www/adminchat">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteRule ^/(api|uploads|photos)/ - [L]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
  RewriteRule ^ - [L]
  RewriteRule ^ /index.html [L]

  ErrorLog "/opt/bitnami/apache/logs/adminchat.kr-ssl-error.log"
  CustomLog "/opt/bitnami/apache/logs/adminchat.kr-ssl-access.log" combined

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/adminchat.kr/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/adminchat.kr/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
