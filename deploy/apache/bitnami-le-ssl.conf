# randomchat.kr HTTPS — Bitnami LAMP
# 배포 대상: /opt/bitnami/apache/conf/bitnami/bitnami-le-ssl.conf

<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName randomchat.kr
  ServerAlias www.randomchat.kr
  DocumentRoot "/var/www/randomchat"

  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:3000/api/
  ProxyPassReverse /api/ http://127.0.0.1:3000/api/
  ProxyPass /uploads/ http://127.0.0.1:3000/uploads/
  ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/
  ProxyPass /photos/ http://127.0.0.1:3000/photos/
  ProxyPassReverse /photos/ http://127.0.0.1:3000/photos/

  <Directory "/var/www/randomchat">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteRule ^/(api|uploads|photos)/ - [L]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f [OR]
  RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
  RewriteRule ^ - [L]
  RewriteRule ^ /index.html [L]

  ErrorLog "/opt/bitnami/apache/logs/randomchat.kr-ssl-error.log"
  CustomLog "/opt/bitnami/apache/logs/randomchat.kr-ssl-access.log" combined

  SSLEngine on
  SSLCertificateFile /etc/letsencrypt/live/randomchat.kr/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/randomchat.kr/privkey.pem
  Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
