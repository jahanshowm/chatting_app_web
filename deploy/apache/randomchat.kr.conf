# randomchat.kr — Bitnami LAMP Apache vhost (HTTP :80)
# Admin Web: /var/www/randomchat
# NestJS API: http://127.0.0.1:3000

<VirtualHost *:80>
  ServerName randomchat.kr
  ServerAlias www.randomchat.kr
  DocumentRoot "/var/www/randomchat"

  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:3000/api/
  ProxyPassReverse /api/ http://127.0.0.1:3000/api/
  ProxyPass /uploads/ http://127.0.0.1:3000/uploads/
  ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/
  ProxyPass /photos/ http://127.0.0.1:3000/photos/
  ProxyPassReverse /photos/ http://127.0.0.1:3000/photos/

  <Directory "/var/www/randomchat">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/(api|uploads|photos)/
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^ /index.html [L]

  ErrorLog "/opt/bitnami/apache/logs/randomchat.kr-error.log"
  CustomLog "/opt/bitnami/apache/logs/randomchat.kr-access.log" combined
</VirtualHost>

# HTTPS(443)는 Bitnami SSL vhost에 ProxyPass 동일 적용 필요 — deploy/apache/randomchat.kr-ssl.snippet.conf 참고
