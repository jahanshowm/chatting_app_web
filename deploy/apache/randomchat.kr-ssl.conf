# randomchat.kr HTTPS — Bitnami는 별도 vhost가 아니라 bitnami-le-ssl.conf 를 사용함
# 서버 경로: /opt/bitnami/apache/conf/bitnami/bitnami-le-ssl.conf
# 인증서 (Let's Encrypt):
#   SSLCertificateFile /etc/letsencrypt/live/randomchat.kr/fullchain.pem
#   SSLCertificateKeyFile /etc/letsencrypt/live/randomchat.kr/privkey.pem
#
# 기존 <VirtualHost *:443> 안에 아래 블록을 넣거나 DocumentRoot/ProxyPass 를 교체

  DocumentRoot "/var/www/randomchat"

  ProxyPreserveHost On
  ProxyPass /api/ http://127.0.0.1:3000/api/
  ProxyPassReverse /api/ http://127.0.0.1:3000/api/
  ProxyPass /uploads/ http://127.0.0.1:3000/uploads/
  ProxyPassReverse /uploads/ http://127.0.0.1:3000/uploads/
  ProxyPass /photos/ http://127.0.0.1:3000/photos/
  ProxyPassReverse /photos/ http://127.0.0.1:3000/photos/

  <Directory "/var/www/randomchat">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
  </Directory>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/(api|uploads|photos)/
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^ /index.html [L]
